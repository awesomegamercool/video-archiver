name: Archive TikTok

on:
  workflow_dispatch:
  repository_dispatch:
    types: [archive_tiktok]

permissions:
  contents: read

concurrency:
  group: tiktok-archiver
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TIKTOK_USERNAME: ${{ secrets.TIKTOK_USERNAME }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create TikTok cookies file
        shell: bash
        env:
          TIKTOK_COOKIES_B64: ${{ secrets.TIKTOK_COOKIES_B64 }}
        run: |
          echo "$TIKTOK_COOKIES_B64" | base64 --decode > "$RUNNER_TEMP/tiktok-cookies.txt"

      - name: Archive TikToks
        run: |
          export TIKTOK_COOKIES_FILE="$RUNNER_TEMP/tiktok-cookies.txt"
          python watcher.py
