name: Archive TikTok

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

concurrency:
  group: tiktok-archiver
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 130

    env:
      TIKTOK_USERNAME: ${{ secrets.TIKTOK_USERNAME }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      APIFY_ACTOR: ${{ secrets.APIFY_ACTOR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install downloader and uploader
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre "yt-dlp[default,curl-cffi]"
          python -m pip install -r requirements.txt

      - name: Create TikTok cookies file
        run: |
          printf '%s' "${{ secrets.TIKTOK_COOKIES }}" > cookies.txt

      - name: Check profile repeatedly
        env:
          TIKTOK_COOKIES_FILE: cookies.txt
        run: |
          for i in {1..24}; do
            echo "Check $i of 24"
            python watcher.py
            if [ "$i" -lt 24 ]; then
              sleep 300
            fi
          done

      - name: Start next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/archive.yml/dispatches \
            -d '{"ref":"main"}'
