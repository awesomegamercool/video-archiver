name = "tiktok-archive"

main = "src/index.js"

compatibility_date = "2026-09-07"


[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "private-tiktok-archive"


[[d1_databases]]
binding = "DB"
database_name = "tiktok-archive"
database_id = "05496d5d-4bfd-4253-b2c1-ddbfdeaee3c6"


[[workflows]]
name = "tiktok-archive-workflow"
binding = "ARCHIVE_WORKFLOW"
class_name = "ArchiveWorkflow"

[triggers]
crons = []

[secrets]
required = [
    "APIFY_TOKEN",
    "TIKTOK_USERNAME",
    "ARCHIVE_PASSWORD",
    "SESSION_SECRET"
]